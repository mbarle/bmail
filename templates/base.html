<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Bmail{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <header class="site-header">
        <div class="header-inner">

            <a class="brand" href="{{ url_for('home') }}">
                <span class="brand-mark">B</span>
                <span>Bmail</span>
            </a>

            {% if session.get("email") %}
            <nav class="main-nav" aria-label="Glavna navigacija">

                <a
                    href="{{ url_for('home') }}"
                    {% if request.endpoint == 'home' %}
                    class="active"
                    {% endif %}
                >
                    Domov
                </a>

                <a
                    href="{{ url_for('poslano') }}"
                    {% if request.endpoint == 'poslano' %}
                    class="active"
                    {% endif %}
                >
                    Poslana sporočila
                </a>

                <a
                    href="{{ url_for('prejeto') }}"
                    {% if request.endpoint == 'prejeto' %}
                    class="active"
                    {% endif %}
                >
                    Prejeta sporočila
                </a>

                <a
                    class="logout-link"
                    href="{{ url_for('logout') }}"
                >
                    Odjava
                </a>

            </nav>
            {% endif %}

        </div>
    </header>


    <main class="page-container">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
